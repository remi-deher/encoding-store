name: Prepare release

# Prépare un instantané du catalogue, sans rien publier ni taguer :
#   construit les archives en attente (build --all-pending, liens épinglés au tag de l'instantané), contrôle le catalogue,
#   crée la section « ## vAAAA.MM.JJ » de CHANGELOG.md, pousse la branche release/vAAAA.MM.JJ et ouvre une PR
#   vers la branche depuis laquelle le workflow a été lancé (dev ou main).
# La publication reste une décision humaine : fusionner la PR (jusqu'à main), puis lancer le workflow « Release ».
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag de l'instantané, vAAAA.MM.JJ (vide = date du jour UTC)"
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: prepare-release
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-24.04
    if: github.ref == 'refs/heads/dev' || github.ref == 'refs/heads/main'
    permissions:
      contents: write        # pousser la branche release/*
      pull-requests: write   # ouvrir la PR
      actions: write         # lancer la CI sur la branche (une PR ouverte avec GITHUB_TOKEN ne la déclenche pas)
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - run: pip install --require-hashes -r requirements/release.txt
      - name: Tag et branche
        id: target
        env:
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          tag="${INPUT_TAG:-v$(date -u +%Y.%m.%d)}"
          if ! printf '%s' "$tag" | grep -Eq '^v[0-9]{4}\.[0-9]{2}\.[0-9]{2}$'; then
            echo "::error::Tag invalide : $tag (attendu vAAAA.MM.JJ)."; exit 1
          fi
          branch="release/$tag"
          if git ls-remote --exit-code --heads origin "$branch" >/dev/null; then
            echo "::error::La branche $branch existe déjà : fusionnez ou supprimez la PR en cours."; exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "branch=$branch" >> "$GITHUB_OUTPUT"
      - name: Préparer l'instantané (build --all-pending, verify, CHANGELOG)
        env:
          TAG: ${{ steps.target.outputs.tag }}
        run: python3 scripts/store.py release-prep --tag "$TAG"
      - name: Tests du Store
        run: python3 -m unittest discover -s scripts/tests -v
      - name: Pousser la branche et ouvrir la PR
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.target.outputs.tag }}
          BRANCH: ${{ steps.target.outputs.branch }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$BRANCH"
          git add -A packages repository.json CHANGELOG.md
          git commit -m "chore(release): prépare $TAG"
          git push origin "$BRANCH"
          {
            echo "Instantané préparé par le workflow « Prepare release » (run $GITHUB_RUN_ID) : archives en attente construites, catalogue contrôlé, section du CHANGELOG."
            echo
            echo "**Rien n'est publié.** Après fusion jusqu'à \`main\` : Actions > Release > Run workflow sur \`main\`, tag \`$TAG\`."
            echo
            echo "Les nouvelles versions sont servies depuis le tag \`$TAG\` : leurs liens répondront dès que la release portera ce tag exact."
            echo
            echo "## $TAG"
            echo
            python3 scripts/store.py changelog "$TAG"
          } > pr-body.md
          if ! gh pr create --base "$GITHUB_REF_NAME" --head "$BRANCH" --title "chore(release): prépare $TAG" --body-file pr-body.md; then
            echo "::warning::PR non créée (réglage « Allow GitHub Actions to create pull requests » désactivé ?). Ouvrez-la à la main : $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/compare/$GITHUB_REF_NAME...$BRANCH"
          fi
          gh workflow run ci.yml --ref "$BRANCH"
          {
            echo "### Instantané $TAG préparé"
            echo
            echo "Branche \`$BRANCH\`, CI lancée. Étape suivante (humaine) : relire et fusionner la PR, puis lancer **Release** sur \`main\` avec le tag \`$TAG\`."
          } >> "$GITHUB_STEP_SUMMARY"
