name: Release

# Publie un instantané signé du catalogue : tag vAAAA.MM.JJ ou lancement manuel.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install fastjsonschema
      - run: python3 scripts/store.py verify
      - name: Checksums
        run: (sha256sum repository.json; find packages -name '*.zip' | sort | xargs sha256sum) > SHA256SUMS
      - name: Build provenance attestation
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            repository.json
            packages/**/*.zip
      - name: GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" repository.json SHA256SUMS --generate-notes
