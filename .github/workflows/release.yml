name: Release

# Publie un instantané signé du catalogue (tag vAAAA.MM.JJ) : SHA256SUMS, attestation de provenance Sigstore, release GitHub.
# Deux déclencheurs, tous deux humains :
#   - lancement manuel depuis main (Actions > Release > Run workflow, tag=vAAAA.MM.JJ) : le tag est créé sur la pointe de main ;
#   - push d'un tag vAAAA.MM.JJ posé sur un commit de main.
# Prérequis : la section « ## vAAAA.MM.JJ » existe dans CHANGELOG.md (workflow « Prepare release » ou store.py release-prep).
on:
  push:
    tags: ["v[0-9][0-9][0-9][0-9].[0-9][0-9].[0-9][0-9]"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag de l'instantané, vAAAA.MM.JJ (doit avoir sa section dans CHANGELOG.md)"
        required: true

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  # Contrôles sans aucun droit d'écriture : seul ce job installe des paquets PyPI.
  verify:
    runs-on: ubuntu-24.04
    if: github.event_name == 'push' || github.ref == 'refs/heads/main'
    outputs:
      tag: ${{ steps.target.outputs.tag }}
      sha: ${{ steps.target.outputs.sha }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Tag et commit publiés
        id: target
        env:
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          if [ "$GITHUB_EVENT_NAME" = push ]; then
            tag="$GITHUB_REF_NAME"
          else
            tag="$INPUT_TAG"
            if git rev-parse -q --verify "refs/tags/$tag" >/dev/null; then
              echo "::error::Le tag $tag existe déjà."; exit 1
            fi
          fi
          sha="$GITHUB_SHA"
          if ! printf '%s' "$tag" | grep -Eq '^v[0-9]{4}\.[0-9]{2}\.[0-9]{2}$'; then
            echo "::error::Tag invalide : $tag (attendu vAAAA.MM.JJ)."; exit 1
          fi
          if ! git merge-base --is-ancestor "$sha" origin/main; then
            echo "::error::$sha n'est pas sur main : seul un commit relu et fusionné dans main est publié."; exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - run: pip install --require-hashes -r requirements/release.txt
      - name: Notes de release (section du CHANGELOG)
        env:
          TAG: ${{ steps.target.outputs.tag }}
        run: python3 scripts/store.py changelog "$TAG" > release-notes.md
      - name: Catalogue valide, rien de publié n'a changé depuis l'instantané précédent
        run: |
          set -euo pipefail
          base="$(git describe --tags --abbrev=0 --match 'v[0-9][0-9][0-9][0-9].[0-9][0-9].[0-9][0-9]' "$GITHUB_SHA^" 2>/dev/null || git rev-list --max-parents=0 "$GITHUB_SHA" | tail -n 1)"
          echo "Base de comparaison : $base"
          python3 scripts/store.py verify --base "$base"
      - name: Checksums
        run: (sha256sum repository.json; find packages -name '*.zip' | sort | xargs sha256sum) > SHA256SUMS
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-metadata
          path: |
            SHA256SUMS
            release-notes.md
          retention-days: 7

  # Seul job doté de droits d'écriture : aucun paquet installé, il signe et publie ce que le job précédent a contrôlé.
  release:
    needs: verify
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ needs.verify.outputs.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release-metadata
      - name: Les fichiers signés sont ceux qui ont été contrôlés
        run: sha256sum --check --strict --quiet SHA256SUMS
      - name: Build provenance attestation
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2.4.0
        with:
          subject-path: |
            repository.json
            SHA256SUMS
            packages/**/*.zip
      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.verify.outputs.tag }}
          SHA: ${{ needs.verify.outputs.sha }}
        run: |
          set -euo pipefail
          if [ "$GITHUB_EVENT_NAME" = push ]; then
            existing=(--verify-tag)
          else
            existing=(--target "$SHA")
          fi
          gh release create "$TAG" repository.json SHA256SUMS --repo "$GITHUB_REPOSITORY" "${existing[@]}" \
            --title "$TAG" --notes-file release-notes.md
