name: CI

on:
  push:
    branches: [main, dev]
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: pip install fastjsonschema ruff mypy
      - name: Lint
        run: ruff check .
      - name: Type check (Python)
        run: mypy
      - name: Type check (JavaScript SDK)
        run: npm ci && npm run typecheck
      # Les contrôles d'intégrité tournent même si le lint ou le typage échoue : un échec sans rapport ne doit pas les masquer.
      - name: Catalogue integrity (hashes, schemas, sources vs latest published archive)
        if: ${{ !cancelled() }}
        run: python3 scripts/store.py verify
      - name: Published packages are immutable
        if: ${{ !cancelled() }}
        env:
          BASE_REF: ${{ github.base_ref }}
          BEFORE: ${{ github.event.before }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = pull_request ]; then
            python3 scripts/store.py verify --base "origin/$BASE_REF"
          elif [ -n "$BEFORE" ] && [ "$BEFORE" != 0000000000000000000000000000000000000000 ]; then
            # Push : le commit précédent doit rester ancêtre de HEAD, sinon l'historique a été réécrit (push forcé).
            python3 scripts/store.py verify --base "$BEFORE" --require-ancestor
          else
            python3 scripts/store.py verify --base origin/main
          fi
      - name: Store tooling tests
        if: ${{ !cancelled() }}
        run: python3 -m unittest discover -s scripts/tests -v
      - name: Plugin tests
        if: ${{ !cancelled() }}
        run: python3 -m unittest discover -s plugins/tests -v
