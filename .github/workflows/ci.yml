name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
  workflow_dispatch:   # lancé par « Prepare release » sur la branche release/* (une PR ouverte par GITHUB_TOKEN ne déclenche pas la CI)

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
      - run: pip install --require-hashes -r requirements/dev.txt
      - name: Lint
        run: ruff check .
      - name: Type check (Python)
        run: mypy
      - name: Type check (JavaScript SDK)
        run: npm ci && npm run typecheck
      # Les contrôles d'intégrité tournent même si le lint ou le typage échoue : un échec sans rapport ne doit pas les masquer.
      - name: Catalogue integrity (hashes, schemas, sources vs latest published archive)
        if: ${{ !cancelled() }}
        run: python3 scripts/store.py verify
      - name: Plugins waiting for an archive
        if: ${{ !cancelled() }}
        run: |
          {
            echo "### Plugins en attente de publication"
            echo '```'
            python3 scripts/store.py pending
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Published packages are immutable
        if: ${{ !cancelled() }}
        env:
          BASE_REF: ${{ github.base_ref }}
          BEFORE: ${{ github.event.before }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = pull_request ]; then
            python3 scripts/store.py verify --base "origin/$BASE_REF"
          elif [ -n "$BEFORE" ] && [ "$BEFORE" != 0000000000000000000000000000000000000000 ]; then
            # Push : le commit précédent doit rester ancêtre de HEAD, sinon l'historique a été réécrit (push forcé).
            python3 scripts/store.py verify --base "$BEFORE" --require-ancestor
          else
            python3 scripts/store.py verify --base origin/main
          fi
      - name: Store tooling tests
        if: ${{ !cancelled() }}
        run: python3 -m unittest discover -s scripts/tests -v
      - name: Plugin tests
        if: ${{ !cancelled() }}
        run: python3 -m unittest discover -s plugins/tests -v
